name: build

# EvoIMS fork of serversideup/ffmpeg-lgpl-builds: Windows x64 only, on
# GitHub-hosted runners (upstream uses Depot runners a fork cannot reach), with
# zlib + FreeType added for drawtext and PNG. Each release carries the exact
# FFmpeg, zlib and FreeType source tarballs it was built from, so the LGPL
# source offer is satisfied from the same place as the binary.
#
# Cuts a release whenever VERSION or the build script changes on main. Also
# triggerable manually via workflow_dispatch. Pull requests build and verify
# but publish nothing. Build number = github.run_number, so every push or
# dispatch produces a fresh, distinct tag.
on:
  push:
    branches: [main]
    paths:
      - VERSION
      - scripts/build-windows.sh
      - .github/workflows/build.yml
  pull_request:
    paths:
      - VERSION
      - scripts/build-windows.sh
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write  # required to create releases + upload assets

jobs:
  build-windows:
    name: build ${{ matrix.target }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6

      - name: read version metadata
        id: meta
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          build="${{ github.run_number }}"
          echo "ffmpeg_version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-${build}" >> "$GITHUB_OUTPUT"

      # Provision MSYS2 + the mingw-w64 toolchain and encoder header packages.
      # The build-windows.sh script verifies these are present and errors if
      # any are missing — so this list is the source of truth. zlib and
      # FreeType are deliberately NOT installed from MSYS2: the script builds
      # them from pinned upstream tarballs.
      - name: set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-yasm
            mingw-w64-x86_64-amf-headers
            mingw-w64-x86_64-libvpl
            mingw-w64-x86_64-openh264
            git
            diffutils
            tar

      - name: build
        shell: msys2 {0}
        run: scripts/build-windows.sh --target ${{ matrix.target }}

      - name: upload build
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ steps.meta.outputs.ffmpeg_version }}-${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}/ffmpeg-${{ steps.meta.outputs.ffmpeg_version }}-${{ matrix.target }}.tar.gz
            dist/${{ matrix.target }}/ffmpeg-${{ steps.meta.outputs.ffmpeg_version }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      # The corresponding source: exactly the tarballs the script verified and built.
      - name: upload sources
        uses: actions/upload-artifact@v7
        with:
          name: sources
          path: |
            build/ffmpeg-${{ steps.meta.outputs.ffmpeg_version }}.tar.xz
            build/sources/*.tar.*
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    if: github.event_name != 'pull_request'
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: read version metadata
        id: meta
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          build="${{ github.run_number }}"
          echo "ffmpeg_version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-${build}" >> "$GITHUB_OUTPUT"

      - name: download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: collect artifacts
        run: |
          mkdir -p release
          find artifacts -path 'artifacts/sources' -prune -o -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' \) -print -exec cp {} release/ \;
          mkdir -p release/source
          find artifacts/sources -type f -exec cp {} release/source/ \;
          ( cd release/source && sha256sum * > SOURCES.sha256 && for f in *.tar.*; do mv "$f" "source-$f"; done && sed -i 's/  /  source-/' SOURCES.sha256 && mv SOURCES.sha256 source-SHA256SUMS.txt )
          mv release/source/* release/ && rmdir release/source
          ls -lh release/

      - name: generate RELEASE-NOTES.md
        run: |
          version="${{ steps.meta.outputs.ffmpeg_version }}"
          build="${{ steps.meta.outputs.build_number }}"
          tag="${{ steps.meta.outputs.tag }}"
          {
            echo "# ${tag}"
            echo
            echo "FFmpeg ${version} (build ${build}) for Windows x64, LGPL-2.1 only — the EvoIMS fork of"
            echo "[serversideup/ffmpeg-lgpl-builds](https://github.com/serversideup/ffmpeg-lgpl-builds), adding"
            echo "zlib and FreeType (both permissive) for the \`drawtext\` filter and the PNG encoder."
            echo
            echo "## Corresponding source"
            echo
            echo "Attached to this release, verbatim (\`source-*\`, hashes in \`source-SHA256SUMS.txt\`):"
            echo
            echo '```'
            cat release/source-SHA256SUMS.txt
            echo '```'
            echo
            echo "Reproduce by checking out this repository at tag \`${tag}\` and running"
            echo "\`scripts/build-windows.sh --target x86_64-pc-windows-msvc\` in an MSYS2 MINGW64 shell"
            echo "with the packages listed in \`.github/workflows/build.yml\`."
            echo
            echo "## Build configuration"
            echo
            echo '```'
            grep -E '^\s+--' scripts/build-windows.sh | sed 's/\\$//' | sed 's/^[[:space:]]*//' | sort -u
            echo '```'
            echo
            echo "The exact \`./configure\` line is recorded in the tarball's \`SOURCE.txt\`."
            echo
            echo "## Artifacts"
            echo
            for sha in release/*.tar.gz.sha256; do
              file="${sha%.sha256}"
              name="$(basename "$file")"
              hash="$(awk '{print $1}' "$sha")"
              echo "- \`${name}\` — \`sha256:${hash}\`"
            done
            echo
            echo "## Verification"
            echo
            echo "Extract and run \`ffmpeg.exe -version\`: the configuration must contain \`--disable-gpl --disable-nonfree --disable-version3\`"
            echo "and \`--enable-zlib --enable-libfreetype\`, and must not contain \`--enable-gpl\`, \`--enable-nonfree\` or \`--enable-version3\`."
          } > release/RELEASE-NOTES.md
          cat release/RELEASE-NOTES.md

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists — updating assets"
            gh release upload "$tag" release/*.tar.gz release/*.sha256 release/source-* --clobber
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes-file release/RELEASE-NOTES.md \
              release/*.tar.gz release/*.sha256 release/source-*
          fi
